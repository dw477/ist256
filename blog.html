<!DOCTYPE html>
<html lang="en">
  <style>@import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
  </style>
  <head>
    <!-- Page information -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A community blog for Penn State students at University Park." />
    <title>Blog | UP Community</title>
   
    <!--Edit  added  bootsrap addon then css call-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="styles.css" rel="stylesheet">
  
  </head>
  <body>
    <!--TEST PAGE FOR CSS AND HTML FORMAT DEV-->
    <header class="d-flex align-items-stretch text-black page_header">
      <div class="header-logo d-flex justify-conent-center audiowide-regular align-items-center text-center">
        <h1 class="d-inline">UP<br>Community</h1>
      </div>
      <div class="header-content" >
        <!--variable width group of variable width buttons for adding menu nav options.-->
          <nav aria-label="Main navigation">
            <ul class="nav-group-ul">
              <li class="nav-group-li">
                  <button class="btn w-100 h-75 audiowide-regular inactive-page-btn" onclick="location.href='index.html'">Home</button>
              </li>
              <li class="nav-group-li">
                  <button class="btn w-100 h-75 audiowide-regular inactive-page-btn" onclick="location.href='signup.html'">Signup</button>
              </li>
              <li class="nav-group-li">
                  <button class="btn w-100 h-75 audiowide-regular inactive-page-btn" onclick="location.href='members.html'">Members</button>
              </li>
              <li class="nav-group-li">
                  <button class="btn w-100 h-75 audiowide-regular inactive-page-btn" onclick="location.href='content.html'">Post!</button>
              </li>
              <li class="nav-group-li">
                  <button class="btn w-100 h-75 audiowide-regular inactive-page-btn" onclick="location.href='cart.html'">Cart</button>
              </li>
              <li class="nav-group-li">
                  <button class="btn w-100 h-75 audiowide-regular inactive-page-btn" onclick="location.href='finalization.html'">Preferences</button>
              </li>
              <li class="nav-group-li">
                  <button class="btn w-100 h-75 audiowide-regular active-page-btn" onclick="location.href='blog.html'">Blog</button>
              </li>
            </ul>
          </nav>
      </div>
    </header>

    <main id="blog-content" class="hide-this">
      <div class="content-layout">
      <div class="body-block nunito-text" style="align-content: center !important; text-align: center;">
        <div id="list-container">
          <div id="status-area"></div>
          <div id="groups-container"></div>
          <nav id="pagination-nav" aria-label="Blog post pages" class="mt-3"></nav>
        </div>

        <div id="content-container" hidden>
          <h2 id="post-title"></h2>
          <div id="post-meta"></div>
          <div id="post-body"></div>
          <button id="back-btn" class="inactive-page-btn h-5 w-5" type="button">Back</button>
        </div>
      </div>

      </div> <!-- END content-layout -->
    </main>

    <!-- Project footer -->
    <footer style="padding-left:2rem;">
      <p class="audiowide-regular tagline">UP Community | IST 256 Group II Project</p>
    </footer>

    <!-- bootsrap js addon-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
    <script src="blog.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

  </body>
</html>
