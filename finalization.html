<!DOCTYPE html>
<html lang="en">
  <style>@import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
  </style>
  <head>
    <!-- Page information -->
    <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A community blog for Penn State students at University Park." />
    <title>Post Preferences | UP Community</title>

    <!--Edit  added  bootsrap addon then css call-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="styles.css" rel="stylesheet">
  </head>


  <body>

    <!-- Site name and navigation -->
    <!--Header && NAV bar section headers-->
    <header class="d-flex align-items-stretch text-black page_header">
      <div class="header-logo d-flex justify-conent-center audiowide-regular align-items-center text-center">
        <h1 class="d-inline">UP<br>Community</h1>
      </div>
      <div class="header-content" >
        <!--variable width group of variable width buttons for adding menu nav options.-->
          <nav aria-label="Main navigation">
            <ul class="nav-group-ul">
              <li class="nav-group-li">
                  <button class="btn w-100 h-75 audiowide-regular inactive-page-btn" onclick="location.href='index.html'">Home</button>
              </li>
              <li class="nav-group-li">
                  <button class="btn w-100 h-75 audiowide-regular inactive-page-btn" onclick="location.href='signup.html'">Signup</button>
              </li>
              <li class="nav-group-li">
                  <button class="btn w-100 h-75 audiowide-regular inactive-page-btn" onclick="location.href='members.html'">Members</button>
              </li>
              <li class="nav-group-li">
                  <button class="btn w-100 h-75 audiowide-regular inactive-page-btn" onclick="location.href='content.html'">Post!</button>
              </li>
              <li class="nav-group-li">
                  <button class="btn w-100 h-75 audiowide-regular inactive-page-btn" onclick="location.href='cart.html'">Cart</button>
              </li>
              <li class="nav-group-li">
                  <button class="btn w-100 h-75 audiowide-regular active-page-btn" onclick="location.href='finalization.html'">Preferences</button>
              </li>
            </ul>
          </nav>
      </div>
    </header>

    <main id="main-content" class="hide-this">
      <!-- Post preferences instructions -->
      <div class="content-layout">
      <div class="body-block nunito-text">
      <h1 class="nunito-bold">Post Preferences</h1>
      <p>Choose default options for your posts.</p>
      <p>Fields marked (required) must be completed.</p>
      <!-- React form container -->
      <div id="finalization-root">
    

<!-- THIS portion loads but immediately gets overridden
      By the DOM rendering part of finalization.js, i dont want to break the things i didnt mak/ i tried a little debuggin but couldnt get it.
      
      The proper css rules are applied to the body portion of this html so anything loaded within by the JS should be formatted and contained properly if not... let me know
      -->

        <!-- Form feedback -->
        <p id="post-preferences-status" role="status" aria-live="polite"></p>

        <!-- Post preferences form -->
        <form id="post-preferences-form" action="finalization.html" method="get" aria-describedby="post-preferences-status">
          <!-- User and post preference fields -->
          <fieldset>
            <legend>Your Post Preferences</legend>
            <p>
              <label for="user-id">User ID (required)</label><br />
              <input type="text" id="user-id" name="userId" class="form-control" required />
            </p>
            <p>
              <!-- Community category options -->
              <label for="post-category">Category (required)</label><br />
              <select id="post-category" name="category" class="form-select" required>
                <option value="" disabled selected>Select a category</option>
                <option value="Classes">Classes and Study Groups</option>
                <option value="Sports">Sports and Campus Life</option>
                <option value="Movies">Movies and Entertainment</option>
              </select>
            </p>
            <p>
              <!-- Post type options -->
              <label for="post-type">Type (required)</label><br />
              <select id="post-type" name="type" class="form-select" required>
                <option value="" disabled selected>Select a type</option>
                <option value="Article">Article</option>
                <option value="Announcement">Announcement</option>
                <option value="Event">Event</option>
              </select>
            </p>
          </fieldset>

          <!-- Save or reset the form -->
          <p>
            <button type="submit" id="save-post-preferences" class="btn active-page-btn">Save Preferences</button>
            <button type="reset" class="btn evil-page-btn">Clear Form</button>
          </p>
        <form>

        <!-- JSON document prepared from the selected preferences -->
        <pre id="post-preferences-json" class="border rounded p-3" aria-label="Post preferences JSON" hidden></pre>
      </div>

      </div> <!--/body-block-->
      </div> <!--/content-layout-->
    </main>

    <!-- Project footer -->
    <footer style="padding-left:2rem;">
      <p class="audiowide-regular tagline">UP Community | IST 256 Group II Project</p>
    </footer>

    <!-- jQuery and React for the post preferences script -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="finalization.js"></script>
  </body>
</html>
